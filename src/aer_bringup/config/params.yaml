# ==============================================================================
# Aztec Electric Racing (AER) - FSAE Autonomous System Parameters
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GLOBAL VEHICLE KINEMATICS & LIMITS (Shared across all nodes)
# ------------------------------------------------------------------------------
/**:
  ros__parameters:
    wheelbase_m: 1.525             # FSAE V.1.2 min wheelbase limit (m)
    track_width_m: 1.200           # Average front/rear track width (m)
    max_steering_angle_rad: 0.436  # Mechanical steering lock limit (~25 deg)
    max_speed_mps: 5.0             # System-wide velocity cap for testing (m/s)
    ebs_trigger_speed_mps: 11.11   # 40 km/h speed threshold for EBS testing

# ------------------------------------------------------------------------------
# 2. SAFETY MONITOR & FAIL-SAFE (SW-03 Watchdog)
# ------------------------------------------------------------------------------
safety_monitor_node:
  ros__parameters:
    stale_data_timeout_sec: 0.200  # FSAE SW-03 200 ms stale data deadline
    check_frequency_hz: 50.0       # Watchdog evaluation loop rate (20 ms)
    enable_hardware_ebs_trip: true # Toggles live UART shutdown signal to STM32

# ------------------------------------------------------------------------------
# 3. CONTROL & ACTUATION LAYER (Stanley & Hardware Bridges)
# ------------------------------------------------------------------------------
controller_node:
  ros__parameters:
    target_speed_mps: 3.0          # Nominal track cruising velocity (m/s)
    k_stanley: 0.5                 # Cross-track lateral error steering gain
    k_soft: 1.0                    # Softening gain for low-speed stability (m/s)
    kp_speed: 1.2                  # Speed controller proportional gain
    ki_speed: 0.05                 # Speed controller integral gain

uart_bridge_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"    # USB/Serial interface to STM32
    baud_rate: 115200              # Communication baud rate
    command_timeout_sec: 0.100     # Local bridge heartbeat timeout

# ------------------------------------------------------------------------------
# 4. PERCEPTION LAYER (Vision, LiDAR & Clustering)
# ------------------------------------------------------------------------------
object_detection_node:             # YOLO11 Stereo Vision
  ros__parameters:
    confidence_threshold: 0.50     # Min confidence for cone detection
    nms_threshold: 0.45            # Non-maximum suppression IoU limit
    max_detection_range_m: 10.0    # 10 m range boundary requirement

lane_detection_node:               # RANSAC Lane Tracking
  ros__parameters:
    ransac_iterations: 1000        # Max RANSAC model iterations
    ransac_distance_threshold_m: 0.05
    min_inlier_ratio: 0.60         # Min points needed to confirm lane boundary

obstacle_detection_node:           # LiDAR Clustering (DBSCAN)
  ros__parameters:
    cluster_epsilon_m: 0.30        # DBSCAN point proximity radius (m)
    min_cluster_points: 5          # Min points to classify an obstacle/cone
    roi_x_min_m: 0.0               # Forward region-of-interest boundary
    roi_x_max_m: 15.0
    roi_y_max_m: 4.0               # Lateral region-of-interest boundary (+/- 4m)

# ------------------------------------------------------------------------------
# 5. LOCALIZATION & SYNCHRONIZATION LAYER
# ------------------------------------------------------------------------------
position_estimation_node:         # EKF State Estimation
  ros__parameters:
    process_noise_q_pos: 0.05      # EKF process covariance for position
    process_noise_q_vel: 0.10      # EKF process covariance for velocity
    measurement_noise_r_gps: 0.50  # GPS position measurement noise
    measurement_noise_r_enc: 0.02  # Wheel encoder tick noise

camera_sync_node:
  ros__parameters:
    target_fps: 30.0               # Image downsample target frame rate

# ------------------------------------------------------------------------------
# 6. PLANNING & DECISION-MAKING FUNNEL
# ------------------------------------------------------------------------------
global_path_planning_node:
  ros__parameters:
    centerline_smoothing_weight: 0.20
    path_resolution_m: 0.10        # Distance between path waypoints (m)

decision_making_node:
  ros__parameters:
    lookahead_distance_m: 4.0      # Path lookahead distance for pure pursuit
    obstacle_stop_distance_m: 2.5  # Critical clearance to trigger obstacle stop
    deceleration_rate_mps2: 2.0    # Comfort stop braking rate (m/s²)